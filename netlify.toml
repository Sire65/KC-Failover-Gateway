[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/e2e"
  to = "/e2e.html"
  status = 200
  force = true

[[redirects]]
  from = "/test3"
  to = "/.netlify/functions/test3"
  status = 200
  force = true

[[redirects]]
  from = "/scenario/*"
  to = "/.netlify/functions/gateway?kc_path=/scenario/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/supergau/*"
  to = "/.netlify/functions/gateway?kc_path=/supergau/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/supergau"
  to = "/.netlify/functions/gateway?kc_path=/supergau"
  status = 200
  force = true

[[redirects]]
  from = "/sync/*"
  to = "/.netlify/functions/gateway?kc_path=/sync/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/gateway"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"
