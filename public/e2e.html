<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC E2E Super-GAU</title><style>body{font-family:system-ui;background:#eef2f7;color:#172033;margin:0;padding:20px}.card{max-width:760px;margin:auto;background:white;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0001}button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;background:#173765;color:white}.ok{color:#15803d}.bad{color:#b91c1c}.log{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:10px;margin-top:14px;font-family:ui-monospace,monospace;font-size:13px}</style></head><body><div class="card"><h1>KC Browser-Super-GAU E2E</h1><p>Dieser Test erzeugt ausschließlich markierte Testtransaktionen.</p><button id="run">E2E-Super-GAU starten</button><h2 id="result">Bereit</h2><div id="log" class="log"></div></div><script>
const G='https://kc-failover-gateway.netlify.app',DB='kc_e2e_supergau_v1',STORE='queue';const $=id=>document.getElementById(id);function log(x){$('log').textContent+=x+'\n'}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'transactionId'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putAll(rows){const d=await db(),t=d.transaction(STORE,'readwrite'),s=t.objectStore(STORE);rows.forEach(x=>s.put(x));return new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function getAll(){const d=await db(),t=d.transaction(STORE,'readonly');return req(t.objectStore(STORE).getAll())}
async function clear(){const d=await db(),t=d.transaction(STORE,'readwrite');t.objectStore(STORE).clear();return new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function post(path,body){const r=await fetch(G+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok&&r.status!==207&&r.status!==409)throw new Error(path+' HTTP '+r.status+' '+JSON.stringify(j));return j}
async function get(path){const r=await fetch(G+path,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(path+' HTTP '+r.status+' '+JSON.stringify(j));return j}
$('run').onclick=async()=>{ $('run').disabled=true;$('log').textContent='';$('result').textContent='Läuft …';$('result').className='';const run=crypto.randomUUID(),registerId='E2E_'+run.slice(0,8),rows=[1,2,3].map(i=>({transactionId:`e2e-${run}-${i}`,registerId,registerName:'E2E_BROWSER',time:new Date(Date.now()+i).toISOString(),recordHash:`e2e-${run}-${i}`,amount:i,test:true}));try{log('0. Test-Queue bereinigen');await clear();log('   OK: alter Testzustand entfernt');log('1. Lokale Queue: 3 Testtransaktionen schreiben');await putAll(rows);let all=await getAll(),local=all.filter(x=>x.registerId===registerId);if(local.length!==3)throw new Error('Aktueller Testlauf enthält '+local.length+' statt 3 Einträge');log('   OK: aktueller Testlauf enthält 3 Einträge');log('2. Totalausfall simuliert: keine Übertragung, Queue bleibt erhalten');await new Promise(r=>setTimeout(r,300));all=await getAll();local=all.filter(x=>x.registerId===registerId);if(local.length!==3)throw new Error('Queue verlor Daten während Ausfallphase');log('   OK: 3/3 lokal erhalten');log('3. Wiederanlauf: Batch-Replay zum produktiven Gateway');const first=await post('/sync/batch',{transactions:local});if(!['OK','PARTIAL'].includes(first.status))throw new Error('Erster Replay fehlgeschlagen');log('   OK: erster Replay abgeschlossen');log('4. Idempotenz: denselben Batch erneut senden');const second=await post('/sync/batch',{transactions:local});const statuses=(second.results||[]).map(x=>x.status);if(statuses.length!==3||!statuses.every(x=>x==='ALREADY_STORED'))throw new Error('Replay ist nicht idempotent: '+statuses.join(','));log('   OK: keine Dubletten');log('5. Restore: Transaktionen wieder aus Gateway laden');const restored=await get('/sync/transactions?register_id='+encodeURIComponent(registerId));const ids=new Set((restored.transactions||[]).map(x=>x.transactionId));if(!rows.every(x=>ids.has(x.transactionId)))throw new Error('Restore unvollständig');log('   OK: 3/3 wiederhergestellt');await clear();$('result').textContent='PASS – Browser-E2E bestanden';$('result').className='ok';}catch(e){$('result').textContent='FAIL – '+e.message;$('result').className='bad';log('FEHLER: '+(e.stack||e.message));try{await clear();log('Test-Queue nach Fehler bereinigt')}catch(_){}}finally{$('run').disabled=false}};
</script></body></html>
