name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Wrangler config
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Live primary + fallback health check
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kc-failover-gateway.ha-joko.workers.dev/"
          response=$(curl --fail --silent --show-error --max-time 30 "$URL")
          echo "$response"
          RESPONSE="$response" node --input-type=module <<'NODE'
          const body = JSON.parse(process.env.RESPONSE || "{}");
          if (body.primary?.reachable !== true) throw new Error(`Supabase unhealthy: ${JSON.stringify(body)}`);
          if (body.fallback?.reachable !== true) throw new Error(`Neon unhealthy: ${JSON.stringify(body)}`);
          if (body.activeBackend !== "SUPABASE") throw new Error(`Expected SUPABASE active: ${JSON.stringify(body)}`);
          NODE

      - name: Scenario 1 - Supabase outage to Neon and recovery
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 30 "https://kc-failover-gateway.ha-joko.workers.dev/scenario/1")
          echo "$response"
          RESPONSE="$response" node --input-type=module <<'NODE'
          const body=JSON.parse(process.env.RESPONSE||"{}");
          if(body.status!=="PASS") throw new Error(JSON.stringify(body));
          if(body.simulatedOutage?.activeBackend!=="NEON") throw new Error(JSON.stringify(body));
          if(body.simulatedOutage?.fallback?.readWrite!==true) throw new Error(JSON.stringify(body));
          if(body.recovery?.activeBackend!=="SUPABASE") throw new Error(JSON.stringify(body));
          NODE

      - name: Scenario 2 - Neon outage while Supabase stays active
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 30 "https://kc-failover-gateway.ha-joko.workers.dev/scenario/2")
          echo "$response"
          RESPONSE="$response" node --input-type=module <<'NODE'
          const body=JSON.parse(process.env.RESPONSE||"{}");
          if(body.status!=="PASS") throw new Error(JSON.stringify(body));
          if(body.simulatedFallbackDown!==true || body.activeBackend!=="SUPABASE") throw new Error(JSON.stringify(body));
          NODE

      - name: Scenario 3 - Both cloud databases down route to local queue
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 30 "https://kc-failover-gateway.ha-joko.workers.dev/scenario/3")
          echo "$response"
          RESPONSE="$response" node --input-type=module <<'NODE'
          const body=JSON.parse(process.env.RESPONSE||"{}");
          if(body.status!=="PASS") throw new Error(JSON.stringify(body));
          if(body.activeBackend!=="LOCAL_QUEUE" || body.localQueueRequired!==true) throw new Error(JSON.stringify(body));
          NODE

      - name: Server Super-GAU matrix summary
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 60 "https://kc-failover-gateway.ha-joko.workers.dev/supergau/server-matrix")
          echo "$response"
          RESPONSE="$response" node --input-type=module <<'NODE'
          const body=JSON.parse(process.env.RESPONSE||"{}");
          if(body.status!=="PASS" || !Array.isArray(body.results) || body.results.length!==3) throw new Error(JSON.stringify(body));
          NODE
