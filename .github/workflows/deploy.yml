name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Wrangler config
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Live primary + fallback health check
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kc-failover-gateway.ha-joko.workers.dev"
          response=""
          for attempt in 1 2 3 4 5 6; do
            echo "Health check attempt $attempt/6"
            if response=$(curl --fail --silent --show-error --max-time 20 "$URL/"); then
              echo "$response"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Worker health endpoint did not return HTTP 2xx."
              exit 1
            fi
            sleep 5
          done

          RESPONSE="$response" node --input-type=module <<'NODE'
          const body = JSON.parse(process.env.RESPONSE || "{}");
          if (body.status !== "OK") throw new Error(`Gateway health is not OK: ${JSON.stringify(body)}`);
          if (body.primary?.name !== "SUPABASE" || body.primary?.reachable !== true) {
            throw new Error(`Supabase primary is not reachable: ${JSON.stringify(body)}`);
          }
          if (body.fallback?.name !== "NEON" || body.fallback?.hyperdriveBinding !== true || body.fallback?.reachable !== true) {
            throw new Error(`Neon fallback is not reachable: ${JSON.stringify(body)}`);
          }
          if (body.activeBackend !== "SUPABASE") {
            throw new Error(`Normal routing should prefer SUPABASE: ${JSON.stringify(body)}`);
          }
          console.log("Normal mode passed: SUPABASE primary + NEON fallback are both healthy.");
          NODE

      - name: SUPER-GAU simulation
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kc-failover-gateway.ha-joko.workers.dev/supergau"
          echo "Running safe SUPER-GAU simulation"
          response=$(curl --fail --silent --show-error --max-time 30 "$URL")
          echo "$response"

          RESPONSE="$response" node --input-type=module <<'NODE'
          const body = JSON.parse(process.env.RESPONSE || "{}");
          const outage = body.phase2SimulatedOutage;
          const recovery = body.phase3Recovery;
          if (body.status !== "PASS") throw new Error(`SUPER-GAU simulation failed: ${JSON.stringify(body)}`);
          if (body.safeSimulation !== true || body.productionSupabaseWasNotStopped !== true) {
            throw new Error(`Simulation safety flags missing: ${JSON.stringify(body)}`);
          }
          if (outage?.primaryForcedDown !== true || outage?.activeBackend !== "NEON") {
            throw new Error(`Failover to NEON did not occur: ${JSON.stringify(body)}`);
          }
          if (outage?.fallback?.readWrite !== true || outage?.fallback?.persistentChanges !== false) {
            throw new Error(`NEON read/write probe failed or left persistent data: ${JSON.stringify(body)}`);
          }
          if (recovery?.primaryReachableAgain !== true || recovery?.activeBackend !== "SUPABASE") {
            throw new Error(`Recovery to SUPABASE failed: ${JSON.stringify(body)}`);
          }
          console.log("SUPER-GAU PASS: simulated Supabase outage -> NEON read/write -> Supabase recovery.");
          NODE
