name: KC Dual Provider Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'netlify/functions/gateway.mjs'
      - 'netlify.toml'
      - 'package.json'
      - '.github/workflows/dual-provider-regression.yml'
  workflow_dispatch:

concurrency:
  group: kc-dual-provider-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dual-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Syntax and module checks
        run: npm run check
      - name: Shared gateway contract
        run: node -e "import('./src/worker.js').then(m=>{if(typeof m.default?.fetch!=='function')process.exit(1);console.log('PASS shared fetch contract')})"
      - name: Netlify adapter contract
        run: node -e "import('./netlify/functions/gateway.mjs').then(m=>{if(typeof m.default!=='function')process.exit(1);console.log('PASS netlify adapter')})"
