name: KC Dual Provider Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'netlify/functions/gateway.mjs'
      - 'netlify.toml'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/dual-provider-regression.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dual-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax and module checks
        run: npm run check
      - name: Shared gateway contract
        run: node -e "import('./src/worker.js').then(m=>{if(typeof m.default?.fetch!=='function')process.exit(1);console.log('PASS shared fetch contract')})"
      - name: Netlify adapter contract
        run: node -e "import('./netlify/functions/gateway.mjs').then(m=>{if(typeof m.default!=='function')process.exit(1);console.log('PASS netlify adapter')})"
      - name: TÜV security release gate
        run: npm run audit:tuv
